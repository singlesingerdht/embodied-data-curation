name: EDC quality checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install '.[formats,test]' ./examples/plugins/algorithm
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/edc -q
      - run: python -m build
      - name: Base wheel lists the nine built-in algorithms
        run: |
          python -m venv /tmp/edc-base
          /tmp/edc-base/bin/pip install dist/*.whl
          cd /tmp && test "$(/tmp/edc-base/bin/edc algorithms | grep -c ir-adapter)" = 9
