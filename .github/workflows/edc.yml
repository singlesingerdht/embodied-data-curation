name: EDC quality checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install '.[formats,test]' ./examples/plugins/algorithm
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/edc -q
      - run: python -m build
      - name: Check framework release contents
        run: python scripts/check_release_contents.py --dist dist
      - name: Base wheel lists the ten built-in algorithms
        run: |
          python -m venv /tmp/edc-base
          /tmp/edc-base/bin/pip install dist/*.whl
          cd /tmp && test "$(/tmp/edc-base/bin/edc algorithms | grep -c ir-adapter)" = 10
      - name: Base wheel discovers quality and four value algorithms without model imports
        run: |
          python -m venv /tmp/edc-base
          /tmp/edc-base/bin/pip install dist/*.whl
          cd /tmp
          /tmp/edc-base/bin/python -c "import sys; from edc.algorithms.registry import algorithms; r=algorithms(); assert not r.discovery_errors; assert sum(p.spec.category=='quality' for p in r.plugins.values())==10; assert [p.spec.id for p in r.plugins.values() if p.spec.category=='value']==['Hand_Intervention','Initial_Placement_Assessment','Initial_State_Distribution','Progress_Stagnation_Attribution']; assert not ({'torch','transformers','sam2','sam3','cv2','PIL','dqs'} & set(sys.modules))"
