name: Data Curation CPU and workflow contracts
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install '.[formats,test]' ./examples/plugins/algorithm
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest tests/dqs -q
      - run: python -m build
      - name: Base wheel outside source, without format or model dependencies
        run: |
          python -m venv /tmp/curation-base
          /tmp/curation-base/bin/pip install dist/*.whl
          cd /tmp
          /tmp/curation-base/bin/dqs algorithms > algorithms.json
          /tmp/curation-base/bin/python -c "import json; assert len(json.load(open('algorithms.json'))) == 9"
          /tmp/curation-base/bin/dqs demo fetch synthetic --output base-demo
          /tmp/curation-base/bin/dqs run base-demo --algorithm Structure_Check --output base-results
          /tmp/curation-base/bin/pip check
      - name: Whole synthetic workflow outside source
        run: |
          python examples/workflows/make_example.py --output /tmp/curation-demo
          cd /tmp
          dqs workflow check /tmp/curation-demo/workflow.yaml
          dqs workflow run /tmp/curation-demo/workflow.yaml --output /tmp/curation-results
          dqs workflow run /tmp/curation-demo/workflow.yaml --output /tmp/curation-results --resume
