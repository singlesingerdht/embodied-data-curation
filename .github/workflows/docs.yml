name: EDC documentation

on:
  push:
    paths: ['docs/**', 'requirements-docs.txt', 'pyproject.toml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'requirements-docs.txt', 'pyproject.toml', '.github/workflows/docs.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Explicitly publish to GitHub Pages (requires Pages setup)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - name: Build documentation (warnings are errors)
        run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: edc-documentation-html
          path: docs/_build/html/
          retention-days: 7
      - name: Prepare Pages artifact only on explicit publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html/

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
