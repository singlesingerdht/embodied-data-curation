[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dqs-example-algorithm"
version = "0.1.0"
dependencies = ["embodied-dqs>=0.1.0a1"]
[project.entry-points."dqs.algorithms"]
team_example__signal_summary = "signal_summary:plugin"
team_example__finite_check = "signal_summary:finite_plugin"
team_example__configured_position = "configured_position:plugin"
team_example__dataset_inventory = "dataset_inventory:plugin"
team_example__image_edit = "image_transform:editing_plugin"
team_example__image_augment = "image_transform:augmentation_plugin"
[tool.setuptools]
py-modules = ["signal_summary", "configured_position", "dataset_inventory", "image_transform"]
