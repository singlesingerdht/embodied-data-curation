[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "edc-workflow-examples"
version = "0.1.0"
dependencies = ["embodied-data-curation>=0.3.0a1", "h5py>=3.8"]
[project.entry-points."edc.algorithms"]
team_example__dataset_inventory = "dataset_inventory:plugin"
team_example__image_edit = "image_transform:editing_plugin"
team_example__image_augment = "image_transform:augmentation_plugin"
[tool.setuptools]
py-modules = ["dataset_inventory", "image_transform"]
