# 由现有 dqs robot init 生成，供用户手工配置；不是已验收的 X1 Pro 配置。
# 本地候选 MCAP 的 topic 与旧 x1_pro 配置匹配，但记录中未确认机器人型号/实例。
# 输入文件及操作步骤见 docs/framework/X1_PRO_CONFIGURATION_WALKTHROUGH.md。
# 已实读：32 个 channel；左右臂 JointState 首条 position/velocity/effort 各 6 维。
# unit/null、source_kind/unknown 等需要由数据提供者确认，不能按数值量级猜测。
# 单个 topic 多种物理量时，在 field_metadata 逐字段填写单位，例如：
#   position: {unit: deg, dimensions: [6]}      # 仅当源数据确认为度时
#   velocity: {unit: deg/s, dimensions: [6]}   # 仅当源数据确认为度每秒时
#   effort: {unit: unknown, dimensions: [6]}  # 未确认电流/力矩时保持未知
# 上述是填写示例，不是这个 MCAP 的已确认单位；不要直接启用这些注释。
# unit 是源单位声明；dqs run 默认按已确认的源单位自动转 SI，未知值不猜测。
# 直接读取源 Episode 保留原值；--unit-policy manual 关闭自动转换并要求自行准备 SI 数据。
# MCAP 读取器把容器 log_time 的 ns 转成 s；顶层 timestamp_unit 不控制 MCAP。
# 当前公共 MCAP 路径暴露 container 时间，不能直接改标 acquisition。
