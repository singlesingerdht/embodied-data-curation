# Example only: merge logical_name into the existing robot profile.
# Source keys below are the confirmed X1 Pro MCAP camera topics.
# Existing units, clocks, calibration and field metadata should be retained.
schema_version: 1
id: x1pro_logical_camera_example
version: '1'
channels:
  /camera_chest_front/color/image_raw/compressed:
    logical_name: rgb/chest
    modality: rgb
    body_part: chest
    sensor_id: chest_front
    representation:
      camera_role: chest
      camera_role_status: confirmed
  /camera_head_front/color/image_raw/compressed:
    logical_name: rgb/head
    modality: rgb
    body_part: head
    sensor_id: head_front
    representation:
      camera_role: head
      camera_role_status: confirmed
  /camera1/usb_cam1/image_raw/image_compressed:
    logical_name: rgb/wrist/left
    modality: rgb
    body_part: wrist
    side: left
    sensor_id: left_wrist
    representation:
      camera_role: wrist
      camera_role_status: confirmed
  /right_arm/joint_states:
    logical_name: joint/arm/right/feedback
    modality: joint_space
    fields: [position]
    side: right
    source_kind: feedback
    unit: null  # Confirm from the actual driver; never infer from the logical name.
  /right_arm/end_pose:
    logical_name: pose/arm/right/feedback
    modality: pose
    fields: [position]
    side: right
    source_kind: feedback
    unit: m  # Confirmed for this X1 Pro source; confirm again for another robot.
  /camera3/usb_cam3/image_raw/image_compressed:
    logical_name: rgb/wrist/right
    modality: rgb
    body_part: wrist
    side: right
    sensor_id: right_wrist
    representation:
      camera_role: wrist
      camera_role_status: confirmed
