# Metadata declares 28 joint and 12 hand values; units and acquisition clock are unconfirmed.
# Keep all six numeric arrays intact instead of inferring Cartesian pose from 'position'.
schema_version: 1
id: lerobot_example_intake
version: '1'
timestamp_unit: s
channels:
  'observation.joint_state.*':
    modality: joint_space
    fields: [recorded_values]
    dimensions: [28]
    unit: unknown
    source_kind: unknown
    time_source: unknown
    calibration_status: unknown
  'observation.dexhand.*':
    modality: joint_space
    fields: [recorded_values]
    dimensions: [12]
    unit: unknown
    source_kind: unknown
    time_source: unknown
    calibration_status: unknown
