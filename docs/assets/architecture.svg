<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">EDC：数据使用者与算法开发者 / Data users and algorithm developers</title>
  <desc id="description">框架面向数据使用者与算法开发者。数据使用者提供数据与配置，经读取和输入检查、算法推荐与选择后，运行 Curation 算法并查看结果。算法开发者通过独立的编写与注册算法步骤，声明输入、参数和输出，进入同一推荐与执行流程。旁侧虚线框仅说明后续接入的价值评估、编辑与增强算法。Data users provide data and configuration, select suitable algorithms, run them, and inspect results. Algorithm developers use a separate writing and registration step to declare inputs, parameters, and outputs before joining the same recommendation and execution flow. A dashed side note lists planned value assessment, editing, and augmentation algorithms.</desc>
