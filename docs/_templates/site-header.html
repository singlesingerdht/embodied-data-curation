<nav aria-label="Guides / 使用指南">
  {% for locale, links in edc_top_navigation.items() %}
  <ul class="navbar-nav edc-header-links edc-locale edc-locale-{{ locale }}" lang="{{ locale }}">
    {% for item in links %}
    <li class="nav-item"><a class="nav-link" href="{{ item.href }}"{% if item.active %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
    {% endfor %}
  </ul>
  {% endfor %}
</nav>
