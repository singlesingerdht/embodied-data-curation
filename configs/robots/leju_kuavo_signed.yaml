schema_version: 1
id: leju_kuavo
version: 0.1.0
model: Leju KUAVO 4pro (dexterous hand)
instance_id: null
status: arm_fk_pose_added_numeric_signoff_pending
min_duration_s: 3.0
parts:
  left:
    type: arm
    side: left
    dof: 7
  right:
    type: arm
    side: right
    dof: 7
  left_hand:
    type: hand
    side: left
    arm: left
  right_hand:
    type: hand
    side: right
    arm: right
  head:
    type: head
    side: unknown
  whole_body:
    type: body
    side: unknown
    dof: 28
  dexhands:
    type: hand_pair
    side: unknown
    dof: 12
camera_requirements:
  head:
  - rgb
  left_wrist:
  - rgb
  right_wrist:
  - rgb
channels:
  /sensors_data_raw:
    modality: other
    fields:
    - joint_q
    - joint_v
    - tau
    time_source: acquisition
    clock: kuavo_common
    source_kind: feedback
    dimensions:
    - 28
    representation:
      layout: joint_q[0:12]=legs, [12:19]=left arm, [19:26]=right arm, [26:28]=head
      layout_evidence: deg(joint_q[12:26]) tracks /kuavo_arm_traj within 0.3-4.2 deg
        median on two bags; other offsets differ by tens of deg
  joint/arm/left/feedback:
    modality: joint_space
    fields:
    - position
    - velocity
    robot_part: left
    body_part: arm
    side: left
    source_kind: feedback
    dimensions:
    - 7
    unit: rad
    time_source: acquisition
    clock: kuavo_common
    select:
      channel: /sensors_data_raw
      fields:
        position: joint_q
        velocity: joint_v
      indices:
      - 12
      - 13
      - 14
      - 15
      - 16
      - 17
      - 18
    field_metadata:
      position:
        unit: rad
        quantity: joint_angle
        semantic_status: confirmed
        confirmed_by: data_evidence_20261027
        confirmation_scope: arm joint angle in rad, order arm_joint_1..7; no common-clock
          claim
        calibration_status: confirmed
        calibration_evidence: '33 bags / 301255 samples (too_short_too_long_normal
          + suboptical, p4-493): all 14 arm joints within biped_s49 URDF limits except
          <=0.002 rad edge contact (L6 0.3%, R2 0.2%); left/right mirror signs match
          URDF; start pose within 0.06 rad of Reset_Detection kuavo Home on 12/14
          joints; confirmed by user 2026-10-28'
      velocity:
        unit: rad/s
        quantity: angular_velocity
        semantic_status: confirmed
        confirmed_by: data_evidence_20261030
        calibration_status: confirmed
        calibration_evidence: '40 bags (tools/jointvel_probe.py): P99 |joint_v| /
          P99 |d(joint_q)/dt| = 0.54-0.97 (deg/s would be ~57); peaks match position
          change, e.g. p4-376 left j5 4.52 rad/s vs 3.95 rad/s mean over 0.2 s'
    logical_name: joint/arm/left/feedback
  joint/arm/right/feedback:
    modality: joint_space
    fields:
    - position
    - velocity
    robot_part: right
    body_part: arm
    side: right
    source_kind: feedback
    dimensions:
    - 7
    unit: rad
    time_source: acquisition
    clock: kuavo_common
    select:
      channel: /sensors_data_raw
      fields:
        position: joint_q
        velocity: joint_v
      indices:
      - 19
      - 20
      - 21
      - 22
      - 23
      - 24
      - 25
    field_metadata:
      position:
        unit: rad
        quantity: joint_angle
        semantic_status: confirmed
        confirmed_by: data_evidence_20261027
        confirmation_scope: arm joint angle in rad, order arm_joint_8..14; no common-clock
          claim
        calibration_status: confirmed
        calibration_evidence: '33 bags / 301255 samples (too_short_too_long_normal
          + suboptical, p4-493): all 14 arm joints within biped_s49 URDF limits except
          <=0.002 rad edge contact (L6 0.3%, R2 0.2%); left/right mirror signs match
          URDF; start pose within 0.06 rad of Reset_Detection kuavo Home on 12/14
          joints; confirmed by user 2026-10-28'
      velocity:
        unit: rad/s
        quantity: angular_velocity
        semantic_status: confirmed
        confirmed_by: data_evidence_20261030
        calibration_status: confirmed
        calibration_evidence: '40 bags (tools/jointvel_probe.py): P99 |joint_v| /
          P99 |d(joint_q)/dt| = 0.54-0.97 (deg/s would be ~57); peaks match position
          change, e.g. p4-376 left j5 4.52 rad/s vs 3.95 rad/s mean over 0.2 s'
    logical_name: joint/arm/right/feedback
  imu/main:
    modality: imu
    fields:
    - ang_vel
    - lin_acc
    - orientation
    source_kind: feedback
    time_source: acquisition
    clock: kuavo_common
    select:
      channel: /sensors_data_raw
      fields:
        ang_vel: imu_gyro
        lin_acc: imu_acc
        orientation: imu_quat
    field_metadata:
      ang_vel:
        quantity: angular_velocity
        dimensions:
        - 3
        unit: rad/s
        semantic_status: confirmed
        confirmed_by: data_evidence_20261030
        calibration_status: confirmed
        calibration_evidence: '33 bags: rotation rate from successive quaternions
          / |gyro| = 0.84-0.92, corr 0.95-0.99; standing |gyro| P99 <= 0.084 rad/s'
      lin_acc:
        quantity: acceleration
        dimensions:
        - 3
        unit: m/s^2
        semantic_status: confirmed
        confirmed_by: data_evidence_20261030
        calibration_status: confirmed
        calibration_evidence: '33 bags: median |acc| 9.781-9.798 m/s^2 (gravity included;
          free_acc is the gravity-removed field)'
      orientation:
        quantity: orientation
        dimensions:
        - 4
        unit: '1'
        semantic_status: confirmed
        confirmed_by: data_evidence_20261030
        calibration_status: unknown
        representation:
          kind: quaternion
          order: xyzw
          unit: '1'
    logical_name: imu/main
  pose/arm/left/feedback:
    modality: pose
    fields:
    - position
    robot_part: left
    body_part: arm
    side: left
    source_kind: feedback
    dimensions:
    - 3
    unit: m
    time_source: acquisition
    clock: kuavo_common
    select:
      fk: left_arm
    field_metadata:
      position:
        unit: m
        quantity: position
        semantic_status: confirmed
        confirmed_by: data_evidence_20261028
        calibration_status: confirmed
        calibration_evidence: 'FK of calibration-confirmed joint/arm/left/feedback
          through biped_s49.urdf base_link->zarm_l7_end_effector; sanity: zero pose
          tip z=-0.284 = shoulder 0.4245 - arm 0.708, left/right mirror y=+-0.263,
          no /tf in bags so no direct reference; confirmed by the Numeric re-sign-off'
    logical_name: pose/arm/left/feedback
  pose/arm/right/feedback:
    modality: pose
    fields:
    - position
    robot_part: right
    body_part: arm
    side: right
    source_kind: feedback
    dimensions:
    - 3
    unit: m
    time_source: acquisition
    clock: kuavo_common
    select:
      fk: right_arm
    field_metadata:
      position:
        unit: m
        quantity: position
        semantic_status: confirmed
        confirmed_by: data_evidence_20261028
        calibration_status: confirmed
        calibration_evidence: 'FK of calibration-confirmed joint/arm/right/feedback
          through biped_s49.urdf base_link->zarm_r7_end_effector; sanity: zero pose
          tip z=-0.284 = shoulder 0.4245 - arm 0.708, left/right mirror y=+-0.263,
          no /tf in bags so no direct reference; confirmed by the Numeric re-sign-off'
    logical_name: pose/arm/right/feedback
  /kuavo_arm_traj:
    modality: other
    fields:
    - position
    source_kind: command
    dimensions:
    - 14
    unit: deg
    time_source: acquisition
    clock: kuavo_common
    joint_names:
    - arm_joint_1
    - arm_joint_2
    - arm_joint_3
    - arm_joint_4
    - arm_joint_5
    - arm_joint_6
    - arm_joint_7
    - arm_joint_8
    - arm_joint_9
    - arm_joint_10
    - arm_joint_11
    - arm_joint_12
    - arm_joint_13
    - arm_joint_14
    field_metadata:
      position:
        unit: deg
        quantity: joint_angle
        semantic_status: confirmed
        confirmed_by: data_evidence_20261027
        confirmation_scope: values within a few deg of rad2deg(sensors joint_q[12:26]);
          velocity/effort arrays are empty
  joint/arm/left/command:
    modality: joint_space
    fields:
    - position
    robot_part: left
    body_part: arm
    side: left
    source_kind: command
    dimensions:
    - 7
    unit: deg
    time_source: acquisition
    clock: kuavo_common
    select:
      channel: /kuavo_arm_traj
      field: position
      indices:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
    field_metadata:
      position:
        unit: deg
        quantity: joint_angle
        semantic_status: confirmed
        confirmed_by: data_evidence_20261027
        calibration_status: confirmed
        calibration_evidence: median(command - nearest feedback) within 0.05 rad on
          all 14 arm joints over 33 bags; elbow +0.046 both sides = tracking sag,
          not offset; confirmed by user 2026-10-28
    logical_name: joint/arm/left/command
  joint/arm/right/command:
    modality: joint_space
    fields:
    - position
    robot_part: right
    body_part: arm
    side: right
    source_kind: command
    dimensions:
    - 7
    unit: deg
    time_source: acquisition
    clock: kuavo_common
    select:
      channel: /kuavo_arm_traj
      field: position
      indices:
      - 7
      - 8
      - 9
      - 10
      - 11
      - 12
      - 13
    field_metadata:
      position:
        unit: deg
        quantity: joint_angle
        semantic_status: confirmed
        confirmed_by: data_evidence_20261027
        calibration_status: confirmed
        calibration_evidence: median(command - nearest feedback) within 0.05 rad on
          all 14 arm joints over 33 bags; elbow +0.046 both sides = tracking sag,
          not offset; confirmed by user 2026-10-28
    logical_name: joint/arm/right/command
  /joint_cmd:
    modality: joint_space
    fields:
    - joint_q
    - joint_v
    - tau
    source_kind: command
    dimensions:
    - 28
    time_source: acquisition
    clock: kuavo_common
    field_metadata:
      joint_q:
        unit: rad
        quantity: joint_angle
        semantic_status: confirmed
        confirmed_by: data_evidence_20261027
        calibration_status: confirmed
        calibration_evidence: median(joint_cmd.joint_q - nearest sensors joint_q)
          within 0.02 rad on all 28 joints over 33 bags; confirmed by user 2026-10-28
        confirmation_scope: same 28-joint order as /sensors_data_raw joint_q
      joint_v:
        unit: null
        quantity: unknown
        semantic_status: unknown
      tau:
        unit: null
        quantity: unknown
        semantic_status: unknown
    robot_part: whole_body
    logical_name: kuavo__joint/body/command
  /dexhand/state:
    modality: other
    fields:
    - position
    - velocity
    - effort
    source_kind: feedback
    dimensions:
    - 12
    time_source: acquisition
    clock: kuavo_common
    joint_names:
    - l_thumb
    - l_thumb_aux
    - l_index
    - l_middle
    - l_ring
    - l_pinky
    - r_thumb
    - r_thumb_aux
    - r_index
    - r_middle
    - r_ring
    - r_pinky
    field_metadata:
      position:
        unit: null
        quantity: unknown
        semantic_status: unknown
      velocity:
        unit: null
        quantity: unknown
        semantic_status: unknown
      effort:
        unit: null
        quantity: unknown
        semantic_status: unknown
    logical_name: kuavo__hand/both/feedback
  /control_robot_hand_position:
    modality: other
    fields: []
    source_kind: command
    time_source: acquisition
    clock: kuavo_common
  /cam_h/color/image_raw/compressed:
    modality: rgb
    time_source: acquisition
    clock: kuavo_common
    body_part: head
    sensor_id: head
    representation:
      camera_role: head
      camera_role_status: confirmed
      camera_role_confirmed_by: frame_id cam_h_color_optical_frame
    logical_name: rgb/head
    robot_part: head
  /cam_l/color/image_raw/compressed:
    modality: rgb
    time_source: acquisition
    clock: kuavo_common
    body_part: wrist
    side: left
    sensor_id: left_wrist
    representation:
      camera_role: wrist
      camera_role_status: pending_user_confirmation
    logical_name: rgb/wrist/left
    robot_part: left
  /cam_r/color/image_raw/compressed:
    modality: rgb
    time_source: acquisition
    clock: kuavo_common
    body_part: wrist
    side: right
    sensor_id: right_wrist
    representation:
      camera_role: wrist
      camera_role_status: pending_user_confirmation
    logical_name: rgb/wrist/right
    robot_part: right
  /cam_h/depth/image_raw/compressedDepth:
    modality: depth
    fields: []
    time_source: acquisition
    clock: kuavo_common
    body_part: head
    representation:
      camera_role: head
      depth_scale: null
      depth_unit: null
    logical_name: depth/head
    robot_part: head
  /cam_l/depth/image_rect_raw/compressedDepth:
    modality: depth
    fields: []
    time_source: acquisition
    clock: kuavo_common
    body_part: wrist
    side: left
    representation:
      camera_role: wrist
      camera_role_status: pending_user_confirmation
      depth_scale: null
      depth_unit: null
    logical_name: kuavo__depth/wrist/left
    robot_part: left
  /cam_r/depth/image_rect_raw/compressedDepth:
    modality: depth
    fields: []
    time_source: acquisition
    clock: kuavo_common
    body_part: wrist
    side: right
    representation:
      camera_role: wrist
      camera_role_status: pending_user_confirmation
      depth_scale: null
      depth_unit: null
    logical_name: kuavo__depth/wrist/right
