robot:
  name: placement_example
  confirmed_by: example camera mapping
data:
  time_note: first RGB frame only, no acquisition clock required
cameras:
  head:
    source: faceImg
    mount: head
checks:
  Initial_Placement_Assessment:
    channel: faceImg
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # Uses the built-in qwen3.8-max default. Set model to override.
    api_key_env: DASHSCOPE_API_KEY
    allow_remote_upload: true
    enable_thinking: false
    # Set this when every episode shares the same SOP. Per-episode metadata takes precedence.
    task_requirements: "The pencil case starts on the left side of the visible work surface."
