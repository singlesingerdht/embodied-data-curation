# Leju KUAVO 4pro（灵巧手版）机器人配置 v0 — 2026-10-27
# 依据：input_example/03_ros1bag_leju 及 too_short_too_long_normal_datasets 中 p4-493 的 ROS1 bag 实测。
# 标记 confirmed 的条目均写明证据来源；仍为 null/unknown 的条目表示尚无依据，不要猜填。
schema_version: 1
id: leju_kuavo
version: 0.1.0
model: Leju KUAVO 4pro (dexterous hand)
instance_id: null
status: arm_fk_pose_added_numeric_signoff_pending
# 最短时长（秒）：短于它的数据由结构完整性判排除，其余 8 个算法不再检查（2026-10-30 用户定 3 秒；不设最长）
min_duration_s: 3.0
parts:
  left: {type: arm, side: left, dof: 7}
  right: {type: arm, side: right, dof: 7}
  left_hand: {type: hand, side: left, arm: left}
  right_hand: {type: hand, side: right, arm: right}
  head: {type: head, side: unknown}
  whole_body: {type: body, side: unknown, dof: 28}
  dexhands: {type: hand_pair, side: unknown, dof: 12}
camera_requirements:
  head: [rgb]
  left_wrist: [rgb]
  right_wrist: [rgb]
channels:
  # ── 时钟（2026-10-29，用户选方案 C）：机器人 5 个话题和 3 个彩色相机都声明为同一个钟 kuavo_common ──
  # 含义是“按设计，全机应在同一时间基准上”，数据不符合就由 Sync_Check / Root_Cause 报出，并在 clock_diagnosis 里写明原因。
  # 证据（tools/clock_probe_all.py，40 条 bag，录包时间 − header）：机器人 5 个话题之间最多差 1.6–4.0 ms（确为同一个钟）；
  # cam_h 40 条都是 15 ms；手腕相机 27 条在 −8 到 44 ms（录包电脑的钟）。不符合的情况：p4-493 机器人钟慢约 32 s，
  # 其中 13 条（3/17–3/18 上午）手腕相机 header 是设备计数；其他机器人相差几十到 200 多 ms。3 个深度图也声明在同一个钟（见相机后面）。
  # ── 全身关节反馈：28 维 = 腿 0-11 / 双臂 12-25 / 头 26-27 ──
  /sensors_data_raw:
    modality: other
    fields: [joint_q, joint_v, tau]
    time_source: acquisition
    clock: kuavo_common  # 由同一条消息拆出的通道（手臂反馈、FK 位姿）共用
    source_kind: feedback
    dimensions: [28]
    representation:
      layout: "joint_q[0:12]=legs, [12:19]=left arm, [19:26]=right arm, [26:28]=head"
      layout_evidence: "deg(joint_q[12:26]) tracks /kuavo_arm_traj within 0.3-4.2 deg median on two bags; other offsets differ by tens of deg"
  # 双臂反馈：joint_q（位置）和 joint_v（速度）取同一组下标；速度用于 Numeric 的关节速度上限（适配层补充检查）
  joint/arm/left/feedback:
    modality: joint_space
    fields: [position, velocity]
    robot_part: left
    body_part: arm
    side: left
    source_kind: feedback
    dimensions: [7]
    unit: rad
    time_source: acquisition
    clock: kuavo_common
    select: {channel: /sensors_data_raw, fields: {position: joint_q, velocity: joint_v}, indices: [12, 13, 14, 15, 16, 17, 18]}
    field_metadata:
      position:
        unit: rad
        quantity: joint_angle
        semantic_status: confirmed
        confirmed_by: data_evidence_20261027
        confirmation_scope: "arm joint angle in rad, order arm_joint_1..7; no common-clock claim"
        calibration_status: confirmed
        calibration_evidence: "33 bags / 301255 samples (too_short_too_long_normal + suboptical, p4-493): all 14 arm joints within biped_s49 URDF limits except <=0.002 rad edge contact (L6 0.3%, R2 0.2%); left/right mirror signs match URDF; start pose within 0.06 rad of Reset_Detection kuavo Home on 12/14 joints; confirmed by user 2026-10-28"
      velocity:
        unit: rad/s
        quantity: angular_velocity
        semantic_status: confirmed
        confirmed_by: data_evidence_20261030
        calibration_status: confirmed
        calibration_evidence: "40 bags (tools/jointvel_probe.py): P99 |joint_v| / P99 |d(joint_q)/dt| = 0.54-0.97 (deg/s would be ~57); peaks match position change, e.g. p4-376 left j5 4.52 rad/s vs 3.95 rad/s mean over 0.2 s"
    logical_name: joint/arm/left/feedback
  joint/arm/right/feedback:
    modality: joint_space
    fields: [position, velocity]
    robot_part: right
    body_part: arm
    side: right
    source_kind: feedback
    dimensions: [7]
    unit: rad
    time_source: acquisition
    clock: kuavo_common
    select: {channel: /sensors_data_raw, fields: {position: joint_q, velocity: joint_v}, indices: [19, 20, 21, 22, 23, 24, 25]}
    field_metadata:
      position:
        unit: rad
        quantity: joint_angle
        semantic_status: confirmed
        confirmed_by: data_evidence_20261027
        confirmation_scope: "arm joint angle in rad, order arm_joint_8..14; no common-clock claim"
        calibration_status: confirmed
        calibration_evidence: "33 bags / 301255 samples (too_short_too_long_normal + suboptical, p4-493): all 14 arm joints within biped_s49 URDF limits except <=0.002 rad edge contact (L6 0.3%, R2 0.2%); left/right mirror signs match URDF; start pose within 0.06 rad of Reset_Detection kuavo Home on 12/14 joints; confirmed by user 2026-10-28"
      velocity:
        unit: rad/s
        quantity: angular_velocity
        semantic_status: confirmed
        confirmed_by: data_evidence_20261030
        calibration_status: confirmed
        calibration_evidence: "40 bags (tools/jointvel_probe.py): P99 |joint_v| / P99 |d(joint_q)/dt| = 0.54-0.97 (deg/s would be ~57); peaks match position change, e.g. p4-376 left j5 4.52 rad/s vs 3.95 rad/s mean over 0.2 s"
    logical_name: joint/arm/right/feedback
  # ── 机身 IMU：/sensors_data_raw 里的 imu_data（kuavo_msgs/imuData），select.fields 只改名不换算 ──
  # 依据（2026-10-30，tools/imu_probe.py，33 条乐聚 bag，5 台机器）：|acc| 中位数 9.781–9.798（重力，单位 m/s^2，含重力，
  #   所以接 acc 不接 free_acc；Numeric 偏置检查按 |acc|-9.81 算）；四元数反推的转速 / |gyro| = 0.84–0.92、相关 0.95–0.99（单位 rad/s，
  #   若是 deg/s 比值应约 0.017）；|quat| 偏离 1 不超过 2.2e-16，字段按 x/y/z/w 命名。安装位置和坐标系未查证，所以用 imu/main、不写 coordinate_frame。
  imu/main:
    modality: imu
    fields: [ang_vel, lin_acc, orientation]
    source_kind: feedback
    time_source: acquisition
    clock: kuavo_common
    select: {channel: /sensors_data_raw, fields: {ang_vel: imu_gyro, lin_acc: imu_acc, orientation: imu_quat}}
    field_metadata:
      ang_vel: {quantity: angular_velocity, dimensions: [3], unit: rad/s, semantic_status: confirmed,
                confirmed_by: data_evidence_20261030, calibration_status: confirmed,
                calibration_evidence: "33 bags: rotation rate from successive quaternions / |gyro| = 0.84-0.92, corr 0.95-0.99; standing |gyro| P99 <= 0.084 rad/s"}
      lin_acc: {quantity: acceleration, dimensions: [3], unit: m/s^2, semantic_status: confirmed,
                confirmed_by: data_evidence_20261030, calibration_status: confirmed,
                calibration_evidence: "33 bags: median |acc| 9.781-9.798 m/s^2 (gravity included; free_acc is the gravity-removed field)"}
      orientation: {quantity: orientation, dimensions: [4], unit: '1', semantic_status: confirmed,
                    confirmed_by: data_evidence_20261030, calibration_status: unknown,
                    representation: {kind: quaternion, order: xyzw, unit: '1'}}
    logical_name: imu/main
  # ── 左手工作点位置：由 transforms.chains.left_arm 正运动学算出，单位 m，坐标系 base_link ──
  pose/arm/left/feedback:
    modality: pose
    fields: [position]
    robot_part: left
    body_part: arm
    side: left
    source_kind: feedback
    dimensions: [3]
    unit: m
    time_source: acquisition
    clock: kuavo_common
    select: {fk: left_arm}
    field_metadata:
      position: {unit: m, quantity: position, semantic_status: confirmed, confirmed_by: data_evidence_20261028,
                 calibration_status: confirmed, calibration_evidence: "FK of calibration-confirmed joint/arm/left/feedback through biped_s49.urdf base_link->zarm_l7_end_effector; sanity: zero pose tip z=-0.284 = shoulder 0.4245 - arm 0.708, left/right mirror y=+-0.263, no /tf in bags so no direct reference; confirmed by the Numeric re-sign-off"}
    logical_name: pose/arm/left/feedback
  # ── 右手工作点位置：由 transforms.chains.right_arm 正运动学算出，单位 m，坐标系 base_link ──
  pose/arm/right/feedback:
    modality: pose
    fields: [position]
    robot_part: right
    body_part: arm
    side: right
    source_kind: feedback
    dimensions: [3]
    unit: m
    time_source: acquisition
    clock: kuavo_common
    select: {fk: right_arm}
    field_metadata:
      position: {unit: m, quantity: position, semantic_status: confirmed, confirmed_by: data_evidence_20261028,
                 calibration_status: confirmed, calibration_evidence: "FK of calibration-confirmed joint/arm/right/feedback through biped_s49.urdf base_link->zarm_r7_end_effector; sanity: zero pose tip z=-0.284 = shoulder 0.4245 - arm 0.708, left/right mirror y=+-0.263, no /tf in bags so no direct reference; confirmed by the Numeric re-sign-off"}
    logical_name: pose/arm/right/feedback
  # ── 双臂目标轨迹（指令），单位 deg，14 维 = 左 7 + 右 7 ──
  /kuavo_arm_traj:
    modality: other  # 源数组，语义由下方 joint/arm/*/command 拆分通道承担
    fields: [position]
    source_kind: command
    dimensions: [14]
    unit: deg
    time_source: acquisition
    clock: kuavo_common
    joint_names: [arm_joint_1, arm_joint_2, arm_joint_3, arm_joint_4, arm_joint_5, arm_joint_6, arm_joint_7,
                  arm_joint_8, arm_joint_9, arm_joint_10, arm_joint_11, arm_joint_12, arm_joint_13, arm_joint_14]
    field_metadata:
      position:
        unit: deg
        quantity: joint_angle
        semantic_status: confirmed
        confirmed_by: data_evidence_20261027
        confirmation_scope: "values within a few deg of rad2deg(sensors joint_q[12:26]); velocity/effort arrays are empty"
  joint/arm/left/command:
    modality: joint_space
    fields: [position]
    robot_part: left
    body_part: arm
    side: left
    source_kind: command
    dimensions: [7]
    unit: deg
    time_source: acquisition
    clock: kuavo_common
    select: {channel: /kuavo_arm_traj, field: position, indices: [0, 1, 2, 3, 4, 5, 6]}
    field_metadata:
      position: {unit: deg, quantity: joint_angle, semantic_status: confirmed, confirmed_by: data_evidence_20261027,
                 calibration_status: confirmed, calibration_evidence: "median(command - nearest feedback) within 0.05 rad on all 14 arm joints over 33 bags; elbow +0.046 both sides = tracking sag, not offset; confirmed by user 2026-10-28"}
    logical_name: joint/arm/left/command
  joint/arm/right/command:
    modality: joint_space
    fields: [position]
    robot_part: right
    body_part: arm
    side: right
    source_kind: command
    dimensions: [7]
    unit: deg
    time_source: acquisition
    clock: kuavo_common
    select: {channel: /kuavo_arm_traj, field: position, indices: [7, 8, 9, 10, 11, 12, 13]}
    field_metadata:
      position: {unit: deg, quantity: joint_angle, semantic_status: confirmed, confirmed_by: data_evidence_20261027,
                 calibration_status: confirmed, calibration_evidence: "median(command - nearest feedback) within 0.05 rad on all 14 arm joints over 33 bags; elbow +0.046 both sides = tracking sag, not offset; confirmed by user 2026-10-28"}
    logical_name: joint/arm/right/command
  # ── 全身关节指令：28 维，与 sensors_data_raw 同序，rad ──
  /joint_cmd:
    modality: joint_space
    fields: [joint_q, joint_v, tau]
    source_kind: command
    dimensions: [28]
    time_source: acquisition
    clock: kuavo_common
    field_metadata:
      joint_q: {unit: rad, quantity: joint_angle, semantic_status: confirmed, confirmed_by: data_evidence_20261027,
                calibration_status: confirmed, calibration_evidence: "median(joint_cmd.joint_q - nearest sensors joint_q) within 0.02 rad on all 28 joints over 33 bags; confirmed by user 2026-10-28",                 confirmation_scope: "same 28-joint order as /sensors_data_raw joint_q"}
      joint_v: {unit: null, quantity: unknown, semantic_status: unknown}
      tau: {unit: null, quantity: unknown, semantic_status: unknown}
    robot_part: whole_body
    logical_name: kuavo__joint/body/command
  # ── 灵巧手：12 维 = 左 6 + 右 6，取值 0-100，物理含义未确认 ──
  /dexhand/state:
    modality: other  # 单位未知（0-100），不能做关节物理检查；确认单位后改回 joint_space
    fields: [position, velocity, effort]
    source_kind: feedback
    dimensions: [12]
    time_source: acquisition
    clock: kuavo_common
    joint_names: [l_thumb, l_thumb_aux, l_index, l_middle, l_ring, l_pinky,
                  r_thumb, r_thumb_aux, r_index, r_middle, r_ring, r_pinky]
    field_metadata:
      position: {unit: null, quantity: unknown, semantic_status: unknown}
      velocity: {unit: null, quantity: unknown, semantic_status: unknown}
      effort: {unit: null, quantity: unknown, semantic_status: unknown}
    logical_name: kuavo__hand/both/feedback
  # 当前读取器不解码 kuavo_msgs/robotHandPosition（left/right_hand_position），先排除出数值检查
  /control_robot_hand_position:
    modality: other
    fields: []
    source_kind: command
    time_source: acquisition
    clock: kuavo_common
  # ── 相机：header 正常时用录包电脑的钟；p4-493 上与机器人话题相差约 32 s（见文件开头时钟说明）──
  /cam_h/color/image_raw/compressed:
    modality: rgb
    time_source: acquisition
    clock: kuavo_common
    body_part: head
    sensor_id: head
    representation: {camera_role: head, camera_role_status: confirmed, camera_role_confirmed_by: frame_id cam_h_color_optical_frame}
    logical_name: rgb/head
    robot_part: head
  /cam_l/color/image_raw/compressed:
    modality: rgb
    time_source: acquisition
    clock: kuavo_common
    body_part: wrist
    side: left
    sensor_id: left_wrist
    representation: {camera_role: wrist, camera_role_status: pending_user_confirmation}
    logical_name: rgb/wrist/left
    robot_part: left
  /cam_r/color/image_raw/compressed:
    modality: rgb
    time_source: acquisition
    clock: kuavo_common
    body_part: wrist
    side: right
    sensor_id: right_wrist
    representation: {camera_role: wrist, camera_role_status: pending_user_confirmation}
    logical_name: rgb/wrist/right
    robot_part: right
  # ── 深度图：header 同彩色图（cam_h 比录包时间早 191–408 ms，是深度处理耗时；手腕在 p4-493 的 13 条里同样是设备计数）──
  # 声明的目的是让 Root_Cause / Check_Timestamp 的“全部话题同一钟”前提成立；深度数值的单位和比例未确认，不做数值检查。
  /cam_h/depth/image_raw/compressedDepth:
    modality: depth
    fields: []
    time_source: acquisition
    clock: kuavo_common
    body_part: head
    representation: {camera_role: head, depth_scale: null, depth_unit: null}
    logical_name: depth/head
    robot_part: head
  /cam_l/depth/image_rect_raw/compressedDepth:
    modality: depth
    fields: []
    time_source: acquisition
    clock: kuavo_common
    body_part: wrist
    side: left
    representation: {camera_role: wrist, camera_role_status: pending_user_confirmation, depth_scale: null, depth_unit: null}
    logical_name: kuavo__depth/wrist/left
    robot_part: left
  /cam_r/depth/image_rect_raw/compressedDepth:
    modality: depth
    fields: []
    time_source: acquisition
    clock: kuavo_common
    body_part: wrist
    side: right
    representation: {camera_role: wrist, camera_role_status: pending_user_confirmation, depth_scale: null, depth_unit: null}
    logical_name: kuavo__depth/wrist/right
    robot_part: right
# ── Numeric_Check 阈值：关节限位按通道分别填写（rad）──
# 来源：Dayan_Datasets/data/robot_data/robots/leju/urdf/4pro_hand.zip → biped_s49.urdf，zarm_l1..l7 / zarm_r1..r7 的 <limit lower upper>
# 每个限位上下各放宽 0.01 rad（约 0.6°）作为传感器余量：33 条 bag 中关节贴住机械限位时读数最多超出 0.002 rad（2026-10-28 用户确认）。
# 左右臂第 2、6 关节方向相反，不能共用一张表。其余阈值沿用方法默认值。
numeric_check:
  thresholds:
    # 关节速度上限（适配层补充检查，原算法没有）：用户 2026-10-30 定 3 rad/s。
    # 40 条 bag 的反馈速度：36 条没有超过 3（P99 0.08–1.24）；超过的 4 条是 p4-374 叠毛巾 3 条和 p4-376，都是手腕 j5 的真实快速转动。
    joint_velocity:
      max_abs: 3.0
    joint:
      limits:
        joint/arm/left/feedback:
          - [-3.151593, 1.580796]
          - [-0.359066, 2.104395]
          - [-1.580796, 1.580796]
          - [-2.627994, 0.01]
          - [-1.580796, 1.580796]
          - [-1.318997, 0.708132]
          - [-0.708132, 0.708132]
        joint/arm/right/feedback:
          - [-3.151593, 1.580796]
          - [-2.104395, 0.359066]
          - [-1.580796, 1.580796]
          - [-2.627994, 0.01]
          - [-1.580796, 1.580796]
          - [-0.708132, 1.318997]
          - [-0.708132, 0.708132]
    # 动作指令限位（2026-10-30 用户定：先不限制，以后按机型改）。框架要求有限数，用 ±1e9 rad 代表无穷大。
    # 填了才算“检查完成”；不填时框架把这项算作未配置，整条数据只能是“未评估完”。
    command_limits:
      limits:
        joint/arm/left/command: [[-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9],
                                 [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9]]
        joint/arm/right/command: [[-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9],
                                  [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9]]
        /joint_cmd: [[-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9],
                     [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9],
                     [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9],
                     [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9],
                     [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9],
                     [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9],
                     [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9], [-1.0e+9, 1.0e+9]]
# ── 正运动学链：base_link（躯干）→ 手工作点 zarm_*7_end_effector ──
# URDF 来自 Dayan_Datasets/data/robot_data/robots/leju/urdf/4pro_hand.zip（kuavo_assets/models/biped_s49/urdf/biped_s49.urdf）。
# limit_margin 0.01 rad：与 Numeric 限位放宽一致（手腕贴住机械限位时读数会超出 URDF 不到 0.002 rad），FK 只算位置，越界由 Numeric_Check 报告。
transforms:
  chains:
    left_arm:
      urdf: leju_kuavo/biped_s49.urdf
      base_frame: base_link
      tip_frame: zarm_l7_end_effector
      limit_margin: 0.01
      inputs:
        zarm_l1_joint: {channel: joint/arm/left/feedback, field: position, index: 0}
        zarm_l2_joint: {channel: joint/arm/left/feedback, field: position, index: 1}
        zarm_l3_joint: {channel: joint/arm/left/feedback, field: position, index: 2}
        zarm_l4_joint: {channel: joint/arm/left/feedback, field: position, index: 3}
        zarm_l5_joint: {channel: joint/arm/left/feedback, field: position, index: 4}
        zarm_l6_joint: {channel: joint/arm/left/feedback, field: position, index: 5}
        zarm_l7_joint: {channel: joint/arm/left/feedback, field: position, index: 6}
    right_arm:
      urdf: leju_kuavo/biped_s49.urdf
      base_frame: base_link
      tip_frame: zarm_r7_end_effector
      limit_margin: 0.01
      inputs:
        zarm_r1_joint: {channel: joint/arm/right/feedback, field: position, index: 0}
        zarm_r2_joint: {channel: joint/arm/right/feedback, field: position, index: 1}
        zarm_r3_joint: {channel: joint/arm/right/feedback, field: position, index: 2}
        zarm_r4_joint: {channel: joint/arm/right/feedback, field: position, index: 3}
        zarm_r5_joint: {channel: joint/arm/right/feedback, field: position, index: 4}
        zarm_r6_joint: {channel: joint/arm/right/feedback, field: position, index: 5}
        zarm_r7_joint: {channel: joint/arm/right/feedback, field: position, index: 6}
# ── Action_Smoothness 频率：2026-10-30 起不在本文件设置 ──
# 运行时用 --params 指定：乐聚推荐 input_example/params/smooth_rate.json（timeline.mode: reference_rate，只借头部相机
# rgb/head 的帧间隔，500 Hz 每隔 17 行取 1 行原始样本，不比较两个钟）。p4-493 机器人钟慢 32 秒，同事的 reference_channel
# 插值方式会因时间不重叠而 NEEDS_REVIEW。原来的 sample_rate_hz 已删除。
# 30 Hz 的依据不变（2026-10-28，tools/jerk_calib.py，40 条乐聚 bag）：30 Hz 时全部 P80 = 4.4，最接近满分线 5。
# ── Reset_Detection：第一帧和最后一帧离 Home 最远的关节不超过 tolerance，否则 NEEDS_REVIEW ──
# Home：原样取自算法自带 Reset_Detection/configs/robots/kuavo/calibrated.yaml 的 home_position.arm（原作者标定）。
#   核对（2026-10-29，tools/reset_probe.py，服务器全部 40 条乐聚 bag）：开头姿态中位数与该 Home 在 11/14 个关节上相差 < 0.07 rad，
#   最大为右臂 j3 0.16 rad；p4-493/372/374/494 等多台机器围绕同一 Home 分布，故全部乐聚 4pro 共用。
# 容差 0.6 rad（约 34°）：用乐聚数据自行定，不是原作者标定（原作者为逐关节 2σ/3σ，左臂 j5 零分线 2.0 rad，太宽，几秒长的片段也会通过；
#   适配层只支持一个统一容差）。依据：too_short_too_long_normal 中 3/17 的 7 条 1.7–4.6 秒片段最大偏差 0.73–1.60，全部不通过；
#   3/18 的 13 条正常录制最大偏差 0.23–0.66，仅 1 条（0.66）不通过；全部 40 条通过 28 条。没有人工标注的“未复位”数据，0.6 是按分布选定。
