# 乐聚 KUAVO 4pro（灵巧手版），ROS1 bag
# 依据：input_example/03_ros1bag_leju 和服务器 40 条乐聚 bag 实测（证据详见 input_example/CHANGES.md 第 3 节）
robot:
  name: leju_kuavo
  confirmed_by: renxiaoshu
  signature: 2e8e91f30277269c

data:
  # bag 里每个话题有自己的时间，不用写 time

arms:
  left:
    # /sensors_data_raw 的 joint_q 有 28 维：腿 0-11 / 左臂 12-18 / 右臂 19-25 / 头 26-27
    joints: {source: /sensors_data_raw, field: joint_q, index: 12-18, unit: rad}
    joint_velocity: {source: /sensors_data_raw, field: joint_v, index: 12-18, unit: rad/s}
    # 双臂目标轨迹 14 维 = 左 7 + 右 7，单位 deg
    joint_command: {source: /kuavo_arm_traj, field: position, index: 0-6, unit: deg}
    # bag 里没录末端位置，用 URDF 从关节角算
    eef_position: fk
    urdf:
      file: leju_kuavo/biped_s49.urdf
      joints: [zarm_l1_joint, zarm_l2_joint, zarm_l3_joint, zarm_l4_joint, zarm_l5_joint, zarm_l6_joint, zarm_l7_joint]   # joint_q 第 12-18 列依次对应
      base_link: base_link
      tip_link: zarm_l7_end_effector
    # 灵巧手 12 维 = 左 6 + 右 6，原始数值：40 条全部是 0~100 的整数（物理单位未知）
    hand: {source: /dexhand/state, field: position, index: 0-5, unit: raw, range: [0, 100]}
    # 灵巧手指令：40 条全是 0~100 的整数（2026-11-03 统计）
    hand_command: {source: /control_robot_hand_position, field: left_hand_position, unit: raw, range: [0, 100]}
    # Home：算法自带 Reset_Detection/configs/robots/kuavo/calibrated.yaml；容差 0.6 rad 按 40 条分布定
    home:
      joints: [-0.19142070412635803, 0.4532884657382965, -0.05640721321105957, -1.673997163772583,
               -0.043963439762592316, -0.003352934028953314, 0.1440676897764206]
      tolerance: 0.6
  right:
    joints: {source: /sensors_data_raw, field: joint_q, index: 19-25, unit: rad}
    joint_velocity: {source: /sensors_data_raw, field: joint_v, index: 19-25, unit: rad/s}
    joint_command: {source: /kuavo_arm_traj, field: position, index: 7-13, unit: deg}
    eef_position: fk
    urdf:
      file: leju_kuavo/biped_s49.urdf
      joints: [zarm_r1_joint, zarm_r2_joint, zarm_r3_joint, zarm_r4_joint, zarm_r5_joint, zarm_r6_joint, zarm_r7_joint]   # joint_q 第 19-25 列依次对应
      base_link: base_link
      tip_link: zarm_r7_end_effector
    hand: {source: /dexhand/state, field: position, index: 6-11, unit: raw, range: [0, 100]}
    hand_command: {source: /control_robot_hand_position, field: right_hand_position, unit: raw, range: [0, 100]}
    home:
      joints: [-0.1637825071811676, -0.36417925357818604, -0.007646217942237854, -1.8297309875488281,
               -0.06254658102989197, -0.10310856252908707, 0.1484537422657013]
      tolerance: 0.6

cameras:
  head: {source: /cam_h/color/image_raw/compressed, info: /cam_h/color/camera_info, mount: head, label: 头部相机}
  left_wrist: {source: /cam_l/color/image_raw/compressed, info: /cam_l/color/camera_info, mount: wrist, arm: left,
               label: 左手腕相机}
  right_wrist: {source: /cam_r/color/image_raw/compressed, info: /cam_r/color/camera_info, mount: wrist, arm: right,
                label: 右手腕相机}
  # 深度图：比例和单位未确认，不做数值检查，只参与时间检查
  head_depth: {source: /cam_h/depth/image_raw/compressedDepth, info: /cam_h/depth/camera_info, mount: head, type: depth}
  left_wrist_depth: {source: /cam_l/depth/image_rect_raw/compressedDepth, info: /cam_l/depth/camera_info, mount: wrist,
                     arm: left, type: depth}
  right_wrist_depth: {source: /cam_r/depth/image_rect_raw/compressedDepth, info: /cam_r/depth/camera_info, mount: wrist,
                      arm: right, type: depth}

# 机身 IMU（在 /sensors_data_raw 里）：|acc| 中位 9.78–9.80 → m/s^2 含重力；角速度和四元数推算一致 → rad/s
imu:
  main: {source: /sensors_data_raw, gyro: {field: imu_gyro, unit: rad/s}, accel: {field: imu_acc, unit: m/s^2},
         orientation: {field: imu_quat, order: xyzw}}

other:
  # 2026-11-01 统计 40 条：tau 量级 ±35，像 N·m，未向厂家确认；joint_cmd 和 joint_q 同一量级（rad）；
  # 灵巧手速度全是 -100~100 的整数、力全是 -1000~1000 的整数（到 ±1000 封顶）
  - {source: /sensors_data_raw, field: tau, label: 全身关节力矩, unit: unknown}
  - {source: /joint_cmd, field: joint_q, label: 全身关节指令, unit: rad}
  - {source: /dexhand/state, field: velocity, label: 灵巧手速度, unit: raw, range: [-100, 100]}
  - {source: /dexhand/state, field: effort, label: 灵巧手力, unit: raw, range: [-1000, 1000]}

checks:
  Root_Cause:
    # 这 5 个话题都由机器人主机发出、共用主机的钟（40 条实测互差 1.6–4.0 ms），算一个来源；
    # 从它们拆出的通道（关节、IMU、灵巧手、other……）自动跟源话题走，不用写
    families:
      /sensors_data_raw: robot
      /kuavo_arm_traj: robot
      /joint_cmd: robot
      /dexhand/state: robot
      /control_robot_hand_position: robot
