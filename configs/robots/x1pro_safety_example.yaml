# X1 Pro pour-tea example: evaluates only original frames [332, 692).
# Legacy intrinsics/transforms and axis-angle interpretation; revalidate for other captures.
# Seventh effort component follows the frozen method as a proxy; not proven gripper torque.
# Change paths before running. Real data is supplied separately by its holder.
robot:
  name: x1pro
  confirmed_by: 'Capture operator: use legacy pour_tea_io.py intrinsics and transforms
    for this example; geometry is not independently revalidated'
data:
  time:
    source: timestamp
    unit: s
  video_frame_time: rows
arms:
  left:
    eef_position:
      source: follow_left_position
      index: 0-2
      unit: m
    gripper:
      source: follow_left_gripper
      unit: cm
      quantity: position
      calibration_status: confirmed
      calibration_reference: 'Operator confirmed both installed non-G grippers have
        the same cm unit and increasing-open direction; native_relative rule; scope:
        this pour-tea capture'
  right:
    eef_position:
      source: follow_right_position
      index: 0-2
      unit: m
    gripper:
      source: follow_right_gripper
      unit: cm
      quantity: position
      calibration_status: confirmed
      calibration_reference: 'Operator confirmed both installed non-G grippers have
        the same cm unit and increasing-open direction; native_relative rule; scope:
        this pour-tea capture'
cameras:
  head:
    source: faceImg
    mount: head
    label: 头部相机
  left_wrist:
    source: leftImg
    mount: wrist
    arm: left
    label: 左夹爪相机
  right_wrist:
    source: rightImg
    mount: wrist
    arm: right
    label: 右夹爪相机
other:
- source: follow_left_joint_effort
  label: follow_left_joint_effort (torque)
  unit: N*m
  quantity: torque
  source_kind: feedback
  calibration_status: confirmed
  calibration_reference: SDK JointState.effort contract applied to this export by
    operator instruction; https://x2robot.com/en/docs/quantax1pro/v1/sdk/data-types/sensor-data-types;
    original robot-bridge export implementation unavailable, no numerical conversion
- source: follow_right_joint_effort
  label: follow_right_joint_effort (torque)
  unit: N*m
  quantity: torque
  source_kind: feedback
  calibration_status: confirmed
  calibration_reference: SDK JointState.effort contract applied to this export by
    operator instruction; https://x2robot.com/en/docs/quantax1pro/v1/sdk/data-types/sensor-data-types;
    original robot-bridge export implementation unavailable, no numerical conversion
- source: follow_left_rotation
  label: left rotation vector
  unit: rad
  quantity: orientation
  source_kind: feedback
  calibration_status: confirmed
  calibration_reference: Legacy pour_tea_io.py axis-angle interpretation, explicitly
    reused for this example
- source: follow_right_rotation
  label: right rotation vector
  unit: rad
  quantity: orientation
  source_kind: feedback
  calibration_status: confirmed
  calibration_reference: Legacy pour_tea_io.py axis-angle interpretation, explicitly
    reused for this example
