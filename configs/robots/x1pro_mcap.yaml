# X1 Pro（自变量 Quanta X1 Pro），MCAP 录制（主从遥操作模式）；和 x1pro.yaml 是同一台机器，数据格式不同
# 依据：/root/20260827174009-pour_egg_from_container_to_pot@MASTER_SLAVE_M.mcap（edc channels 列出的话题）；
# 单位和相机位置取自师兄原来的完整 profile（2026-11-04，用户确认过的部分）
robot:
  name: x1pro_mcap
  confirmed_by: renxiaoshu
  signature: 9bee24bb3fde821a

# ROS 消息自带 header 时间，data 不用写

arms:
  left:
    # 6 个手臂关节，顺序和 URDF 的 left_arm_joint1~6 一致
    joints: {source: /left_arm/joint_states, field: position, index: 0-5, unit: rad}
    joint_velocity: {source: /left_arm/joint_states, field: velocity, index: 0-5, unit: rad/s}
    eef_position: {source: /left_arm/end_pose, field: position, index: 0-2, unit: m}
    eef_orientation: {source: /left_arm/end_pose, field: orientation, index: 0-3, unit: quaternion, order: xyzw}
    # 夹爪单位没确认：只查有没有坏数
    gripper: {source: /left_gripper/joint_states, field: position, unit: unknown}
    eef_command: {source: /master_left_arm/end_pose, field: position, index: 0-2, unit: m}   # 主臂（遥操作）末端
    gripper_command: {source: /master_left_gripper/joint_states, field: position, unit: unknown}
    urdf:
      file: x1pro/x1pro_left_arm.urdf
      joints: [left_arm_joint1, left_arm_joint2, left_arm_joint3, left_arm_joint4, left_arm_joint5, left_arm_joint6]
      base_link: left_arm_base_link
      tip_link: left_arm_link6
    # 师兄从同一台机器标定的末端初始位置（米）；tolerance 取他各轴第二档容差的最大值（右臂 Y 0.0224）
    home: {eef_position: [-0.00701, 0.00282, 0.00276], tolerance: 0.023}
  right:
    joints: {source: /right_arm/joint_states, field: position, index: 0-5, unit: rad}
    joint_velocity: {source: /right_arm/joint_states, field: velocity, index: 0-5, unit: rad/s}
    eef_position: {source: /right_arm/end_pose, field: position, index: 0-2, unit: m}
    eef_orientation: {source: /right_arm/end_pose, field: orientation, index: 0-3, unit: quaternion, order: xyzw}
    gripper: {source: /right_gripper/joint_states, field: position, unit: unknown}
    eef_command: {source: /master_right_arm/end_pose, field: position, index: 0-2, unit: m}
    gripper_command: {source: /master_right_gripper/joint_states, field: position, unit: unknown}
    urdf:
      file: x1pro/x1pro_right_arm.urdf
      joints: [right_arm_joint1, right_arm_joint2, right_arm_joint3, right_arm_joint4, right_arm_joint5, right_arm_joint6]
      base_link: right_arm_base_link
      tip_link: right_arm_link6
    home: {eef_position: [-0.00766, 0.01541, -0.01058], tolerance: 0.023}

cameras:
  head: {source: /camera_head_front/color/image_raw/compressed, mount: head, label: 头部相机}
  head_depth: {source: /camera_head_front/depth/image_raw/compressedDepth, mount: head, type: depth, label: 头部深度}
  chest: {source: /camera_chest_front/color/image_raw/compressed, mount: chest, label: 胸前相机}
  left_wrist: {source: /camera1/usb_cam1/image_raw/image_compressed, mount: wrist, arm: left, label: 左腕相机}
  right_wrist: {source: /camera3/usb_cam3/image_raw/image_compressed, mount: wrist, arm: right, label: 右腕相机}

# 其他数值：只查有没有 NaN/无穷大；单位没确认，写 unknown
other:
  - {source: /left_arm/joint_states, field: effort, label: 左臂关节力矩, unit: unknown}
  - {source: /right_arm/joint_states, field: effort, label: 右臂关节力矩, unit: unknown}
  - {source: /head/joint_states, field: position, label: 头部关节, unit: unknown}
  - {source: /lift/joint_states, field: position, label: 升降机构, unit: unknown}
