schema_version: 1
id: single_arm
version: '1'
model: User supplied single arm
instance_id: null
parts:
  main: {type: arm, side: unknown}
channels:
  /joint_states:
    robot_part: main
    logical_name: joint/arm/main/feedback
    modality: joint_space
    source_kind: feedback
    fields: [position, velocity, effort]
    unit: null
    field_metadata:
      position: {quantity: unknown, semantic_status: unknown, unit: null}
  /end_pose:
    robot_part: main
    logical_name: pose/arm/main/feedback
    modality: pose
    source_kind: feedback
    fields: [position, orientation]
    unit: null
    field_metadata:
      position: {quantity: unknown, semantic_status: unknown, unit: null}
