# X1 Pro 单条轨迹目录（robot-bridge JSON + 3 路 MP4）机器人配置 v0 — 2026-10-31
# 依据：/mnt/public/datasets/x1pro 下随机 200 条（15 个任务）实测，工具 input_example/tools/x1pro_survey.py、x1pro_values.py、x1pro_stats.py。
# 和同事的 x1_pro.yaml（ROS2 MCAP 话题名）是同一种机器人、不同的存储格式，所以单独一份。
# 标记 confirmed 的条目写明证据；仍为 null/unknown 的条目表示尚无依据，不要猜填。
schema_version: 1
id: x1pro_episode
version: 0.1.0
model: X1 Pro (robot-bridge-v260630 episode JSON)
instance_id: null
status: draft_numeric_signoff_pending
# 最短时长（秒）：短于它的数据由结构完整性判排除，其余 8 个算法不再检查（2026-10-30 用户定 3 秒，适用所有机型）
min_duration_s: 3.0
# 行时间：JSON 每行的 timestamp 是 Unix 秒。证据：首行 1787281153.94 = 2026-08-21 10:59:13（UTC+8），和目录名时间一致；
# 200 条相邻行间隔中位数 32 ms（约 30 Hz），没有倒退。
timestamp_column: timestamp
timestamp_unit: s
# 3 路 MP4 每帧对应 JSON 的一行（导出时已按视频帧对齐）：200 条里 599/600 路视频帧数 = JSON 行数（30 fps）。
# 帧数不等的那一路保持按 fps 生成的时间，并在证据里写明原因。
video_frame_time: rows
# 每只手臂的位置、速度、力矩在 JSON 里是 3 列，这里合成一个通道（逐行，不改数值），供下面按下标拆出 6 个手臂关节。
episode_column_groups:
  follow_left_joint: {position: follow_left_joint_position, velocity: follow_left_joint_velocity, effort: follow_left_joint_effort}
  follow_right_joint: {position: follow_right_joint_position, velocity: follow_right_joint_velocity, effort: follow_right_joint_effort}
parts:
  left: {type: arm, side: left, dof: 6}
  right: {type: arm, side: right, dof: 6}
camera_requirements:
  head: [rgb]
  left_wrist: [rgb]
  right_wrist: [rgb]
channels:
  # ── 从臂（机器人本体）7 维：前 6 个是手臂关节，第 7 个和 follow_*_gripper 完全相同（200 条全部相等），是夹爪 ──
  follow_left_joint:
    modality: other  # 源数组，手臂语义由下方 joint/arm/left/feedback 拆分通道承担
    fields: [position, velocity, effort]
    source_kind: feedback
    dimensions: [7]
    time_source: acquisition
    clock: x1pro_rows
    field_metadata:
      position: {unit: null, quantity: unknown, semantic_status: unknown}
      velocity: {unit: null, quantity: unknown, semantic_status: unknown}
      effort: {unit: null, quantity: unknown, semantic_status: unknown}
  follow_right_joint:
    modality: other
    fields: [position, velocity, effort]
    source_kind: feedback
    dimensions: [7]
    time_source: acquisition
    clock: x1pro_rows
    field_metadata:
      position: {unit: null, quantity: unknown, semantic_status: unknown}
      velocity: {unit: null, quantity: unknown, semantic_status: unknown}
      effort: {unit: null, quantity: unknown, semantic_status: unknown}
  joint/arm/left/feedback:
    modality: joint_space
    fields: [position, velocity]
    robot_part: left
    body_part: arm
    side: left
    source_kind: feedback
    dimensions: [6]
    unit: rad
    time_source: acquisition
    clock: x1pro_rows
    select: {channel: follow_left_joint, fields: {position: position, velocity: velocity}, indices: [0, 1, 2, 3, 4, 5]}
    field_metadata:
      position:
        unit: rad
        quantity: joint_angle
        semantic_status: confirmed
        confirmed_by: data_evidence_20261031
        calibration_status: confirmed
        calibration_evidence: "200 episodes (x1pro_stats.py): all 12 arm joints within -2.7..2.95 rad; j2 never below -0.006 and j3 never above 0.006 (mechanical stops at 0); start pose median within 0.07 rad of 0 on 10/12 joints"
      velocity:
        unit: rad/s
        quantity: angular_velocity
        semantic_status: confirmed
        confirmed_by: data_evidence_20261031
        calibration_status: confirmed
        calibration_evidence: "P99 |velocity| / P99 |d(position)/dt| = 0.97-1.05 per joint on 2 episodes (x1pro_values.py); deg/s would be ~57"
    logical_name: joint/arm/left/feedback
  joint/arm/right/feedback:
    modality: joint_space
    fields: [position, velocity]
    robot_part: right
    body_part: arm
    side: right
    source_kind: feedback
    dimensions: [6]
    unit: rad
    time_source: acquisition
    clock: x1pro_rows
    select: {channel: follow_right_joint, fields: {position: position, velocity: velocity}, indices: [0, 1, 2, 3, 4, 5]}
    field_metadata:
      position:
        unit: rad
        quantity: joint_angle
        semantic_status: confirmed
        confirmed_by: data_evidence_20261031
        calibration_status: confirmed
        calibration_evidence: "200 episodes (x1pro_stats.py): all 12 arm joints within -2.7..2.95 rad; j2 never below -0.006 and j3 never above 0.006 (mechanical stops at 0); start pose median within 0.07 rad of 0 on 10/12 joints"
      velocity:
        unit: rad/s
        quantity: angular_velocity
        semantic_status: confirmed
        confirmed_by: data_evidence_20261031
        calibration_status: confirmed
        calibration_evidence: "P99 |velocity| / P99 |d(position)/dt| = 0.97-1.05 per joint on 2 episodes (x1pro_values.py); deg/s would be ~57"
    logical_name: joint/arm/right/feedback
  # ── 手末端位置（米）：开机零位附近为 (0,0,0)（200 条开头中位数 |p| 约 1 cm），是机器人自己给的末端位置，不是我们算的 ──
  follow_left_position:
    modality: pose
    fields: [position]
    robot_part: left
    body_part: arm
    side: left
    source_kind: feedback
    dimensions: [3]
    unit: m
    time_source: acquisition
    clock: x1pro_rows
    field_metadata:
      position: {unit: m, quantity: position, semantic_status: confirmed, confirmed_by: data_evidence_20261031,
                 calibration_status: confirmed, calibration_evidence: "range about +-0.4 m; tip speed P99 0.17-0.52 m/s, max 1.1 m/s on 2 episodes; same field name and Home (about 0) as the algorithm's own quanta_x1 calibration"}
    logical_name: pose/arm/left/feedback
  follow_right_position:
    modality: pose
    fields: [position]
    robot_part: right
    body_part: arm
    side: right
    source_kind: feedback
    dimensions: [3]
    unit: m
    time_source: acquisition
    clock: x1pro_rows
    field_metadata:
      position: {unit: m, quantity: position, semantic_status: confirmed, confirmed_by: data_evidence_20261031,
                 calibration_status: confirmed, calibration_evidence: "range about +-0.4 m; tip speed P99 0.17-0.52 m/s, max 1.1 m/s on 2 episodes; same field name and Home (about 0) as the algorithm's own quanta_x1 calibration"}
    logical_name: pose/arm/right/feedback
  # 末端姿态 3 个数，表示方式（欧拉角顺序）未查证：只检查有限值
  follow_left_rotation: {modality: other, fields: [rotation], source_kind: feedback, dimensions: [3], time_source: acquisition, clock: x1pro_rows}
  follow_right_rotation: {modality: other, fields: [rotation], source_kind: feedback, dimensions: [3], time_source: acquisition, clock: x1pro_rows}
  # 夹爪：两种量程（最大约 0.57 或约 4.7），单位未知：只检查有限值
  follow_left_gripper: {modality: other, fields: [position], source_kind: feedback, time_source: acquisition, clock: x1pro_rows}
  follow_right_gripper: {modality: other, fields: [position], source_kind: feedback, time_source: acquisition, clock: x1pro_rows}
  # ── 主臂（遥操作手柄）：只录了末端位置、姿态和夹爪；关节位置/速度/力矩 200 条全部是 0（没录），不检查 ──
  master_left_position:
    modality: pose
    fields: [position]
    robot_part: left
    body_part: arm
    side: left
    source_kind: command
    dimensions: [3]
    unit: m
    time_source: acquisition
    clock: x1pro_rows
    field_metadata:
      position: {unit: m, quantity: position, semantic_status: confirmed, confirmed_by: data_evidence_20261031,
                 calibration_status: confirmed, calibration_evidence: "tracks follow_left_position within about 1-2 cm (sushi 0821: P50 0.000 vs 0.001 m, max 0.323 vs 0.319 m)"}
    logical_name: pose/arm/left/command
  master_right_position:
    modality: pose
    fields: [position]
    robot_part: right
    body_part: arm
    side: right
    source_kind: command
    dimensions: [3]
    unit: m
    time_source: acquisition
    clock: x1pro_rows
    field_metadata:
      position: {unit: m, quantity: position, semantic_status: confirmed, confirmed_by: data_evidence_20261031,
                 calibration_status: confirmed, calibration_evidence: "tracks follow_right_position within about 1-2 cm (sushi 0821: max 0.310 vs 0.306 m)"}
    logical_name: pose/arm/right/command
  master_left_rotation: {modality: other, fields: [rotation], source_kind: command, dimensions: [3], time_source: acquisition, clock: x1pro_rows}
  master_right_rotation: {modality: other, fields: [rotation], source_kind: command, dimensions: [3], time_source: acquisition, clock: x1pro_rows}
  master_left_gripper: {modality: other, fields: [position], source_kind: command, time_source: acquisition, clock: x1pro_rows}
  master_right_gripper: {modality: other, fields: [position], source_kind: command, time_source: acquisition, clock: x1pro_rows}
  master_left_joint_position: {modality: other, fields: [], time_source: acquisition, clock: x1pro_rows}
  master_left_joint_velocity: {modality: other, fields: [], time_source: acquisition, clock: x1pro_rows}
  master_left_joint_effort: {modality: other, fields: [], time_source: acquisition, clock: x1pro_rows}
  master_right_joint_position: {modality: other, fields: [], time_source: acquisition, clock: x1pro_rows}
  master_right_joint_velocity: {modality: other, fields: [], time_source: acquisition, clock: x1pro_rows}
  master_right_joint_effort: {modality: other, fields: [], time_source: acquisition, clock: x1pro_rows}
  # 原始列已并入上面的 follow_*_joint 组，不单独检查
  follow_left_joint_position: {modality: other, fields: [], time_source: acquisition, clock: x1pro_rows}
  follow_left_joint_velocity: {modality: other, fields: [], time_source: acquisition, clock: x1pro_rows}
  follow_left_joint_effort: {modality: other, fields: [], time_source: acquisition, clock: x1pro_rows}
  follow_right_joint_position: {modality: other, fields: [], time_source: acquisition, clock: x1pro_rows}
  follow_right_joint_velocity: {modality: other, fields: [], time_source: acquisition, clock: x1pro_rows}
  follow_right_joint_effort: {modality: other, fields: [], time_source: acquisition, clock: x1pro_rows}
  # ── 头、升降、底盘：几乎不动，含义和单位未查证：只检查有限值 ──
  head_rotation: {modality: other, fields: [value], dimensions: [2], time_source: acquisition, clock: x1pro_rows}
  head_pitch: {modality: other, fields: [value], dimensions: [3], time_source: acquisition, clock: x1pro_rows}
  head_yaw: {modality: other, fields: [value], dimensions: [3], time_source: acquisition, clock: x1pro_rows}
  lifting_mechanism_position: {modality: other, fields: [value], time_source: acquisition, clock: x1pro_rows}
  car_pose_odom: {modality: other, fields: [value], dimensions: [3], time_source: acquisition, clock: x1pro_rows}
  car_pose_odom_position: {modality: other, fields: [value], dimensions: [3], time_source: acquisition, clock: x1pro_rows}
  car_pose_odom_rotation: {modality: other, fields: [value], dimensions: [3], time_source: acquisition, clock: x1pro_rows}
  velocity_decomposed_odom: {modality: other, fields: [value], dimensions: [3], time_source: acquisition, clock: x1pro_rows}
  # ── 相机：抽帧看过画面（sushi 0821 第 40 秒）：faceImg 是头部俯视整张桌子，leftImg/rightImg 是左/右夹爪上的相机 ──
  faceImg:
    modality: rgb
    time_source: acquisition
    clock: x1pro_rows
    body_part: head
    sensor_id: head
    representation: {camera_role: head, camera_role_status: confirmed, camera_role_confirmed_by: frame_view_20261031}
    logical_name: rgb/head
  leftImg:
    modality: rgb
    time_source: acquisition
    clock: x1pro_rows
    body_part: wrist
    side: left
    sensor_id: left_wrist
    representation: {camera_role: wrist, camera_role_status: confirmed, camera_role_confirmed_by: frame_view_20261031}
    logical_name: rgb/wrist/left
    robot_part: left
  rightImg:
    modality: rgb
    time_source: acquisition
    clock: x1pro_rows
    body_part: wrist
    side: right
    sensor_id: right_wrist
    representation: {camera_role: wrist, camera_role_status: confirmed, camera_role_confirmed_by: frame_view_20261031}
    logical_name: rgb/wrist/right
    robot_part: right
# ── Numeric_Check 阈值：来自厂家 URDF（2026-10-31 用户定）──
# 来源：GitHub X-Square-Robot/sdk_arm_6a，deps/zbl_arm_6a_description/.../urdf/zbl_arm_6a.urdf.xacro（arm_joint1..6 的 <limit>），
# 副本在 E:\yjc\input_example\urdf_x1pro。X1 Pro = 自变量 Quanta X1 Pro，两臂同一型号、同一张限位表（实测左右臂 j2 都只有正值、j3 都只有负值）。
# 核对：随机 178 条 / 35.5 万行，12 个关节都在限位内，只有 j3 在 0 附近超出 0.004–0.007 rad（0.06–0.09% 的行，靠在零位机械限位时的读数噪声）；
# 不卡住时用这份 URDF 从关节角算出的末端位置和记录值差 0.5–2 mm（tools/x1pro_urdf_limits.py、x1pro_fk_check.py）。
# 每个限位上下各放宽 0.01 rad（约 0.6°），和乐聚一样。
numeric_check:
  thresholds:
    # 关节速度上限：URDF 的 <limit velocity>，j1–j3 4.188 rad/s，j4–j6 3.77 rad/s（之前沿用乐聚的 3 rad/s）。
    joint_velocity:
      max_abs: [4.188, 4.188, 4.188, 3.77, 3.77, 3.77]
    joint:
      limits:
        joint/arm/left/feedback:
          - [-2.8025, 2.8025]
          - [-0.01, 3.6752]
          - [-2.8025, 0.01]
          - [-1.5808, 1.5808]
          - [-1.5808, 1.5808]
          - [-1.9299, 1.9299]
        joint/arm/right/feedback:
          - [-2.8025, 2.8025]
          - [-0.01, 3.6752]
          - [-2.8025, 0.01]
          - [-1.5808, 1.5808]
          - [-1.5808, 1.5808]
          - [-1.9299, 1.9299]
calibration:
  # 复位检测：方法和乐聚一样（开头和结尾，离 Home 最远的分量不超过容差就通过），但 X1 Pro 用手末端位置（米），不用关节角：
  # 有些数据关节读数会卡住几十秒到整条（见 Numeric 的 joint_stuck），卡住时关节角不代表真实姿态，末端位置是对的。
  # Home 用算法自带 Reset_Detection/configs/robots/quanta_x1/calibrated.yaml 的 position（同样的字段名，约为原点）。
  # 容差 5 cm：200 条开头和结尾都在 5 cm 内的 183 条；3 cm 时 157 条、8 cm 时 189 条。用关节角 0.6 rad 时结尾只有 57% 通过，主要是卡住的关节造成的。
  Reset_Detection:
    unit: m
    tolerance: 0.05
    reference:
      follow_left_position: [-0.007010698318481445, 0.0028152498416602617, 0.002762031741440296]
      follow_right_position: [-0.007658312562853098, 0.01540503278374672, -0.010580490343272686]
