# Opt-in configuration; bind and confirm actual hardware. Unknown IMU orientation is not assumed to be quaternion.
schema_version: 1
id: single_arm_sensors
version: '1'
parts:
  main:
    type: arm
    side: unknown
  main_wrist:
    type: sensor_mount
    side: unknown
    arm: main
channels:
  imu/wrist/main:
    logical_name: imu/wrist/main
    modality: imu
    robot_part: main_wrist
    fields:
    - ang_vel
    - lin_acc
    - orientation
    source_kind: unknown
    time_source: unknown
    clock: null
    calibration_status: unknown
    coordinate_frame: null
    field_metadata:
      ang_vel:
        quantity: angular_velocity
        dimensions:
        - 3
        unit: null
        semantic_status: pending
      lin_acc:
        quantity: acceleration
        dimensions:
        - 3
        unit: null
        semantic_status: pending
      orientation:
        quantity: orientation
        dimensions: null
        unit: null
        semantic_status: pending
        representation:
          kind: unknown
