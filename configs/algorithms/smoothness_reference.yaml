# Algorithm-side selection. Robot/dataset config must supply verified clocks or mapping.
# Missing clock confirmation returns NEEDS_REVIEW; this file does not assert synchronization.
defaults:
  arms: all
  selection: runnable
methods:
  Action_Smoothness:
    params:
      timeline:
        mode: reference_channel
        reference_channel: rgb/head
        time_source: acquisition
        resample: linear
        clock_policy: require_common_or_explicit_mapping
      expected_rate_hz: 30
      rate_tolerance_ratio: 0.2
      window_length: 11
      vel_threshold_factor: 0.1
      jerk_threshold_m_s3: 15
