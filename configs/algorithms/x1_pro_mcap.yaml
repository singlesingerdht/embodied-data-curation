defaults:
  arms: all
  selection: explicit
methods:
  Action_Smoothness:
    params:
      timeline:
        mode: reference_channel
        reference_channel: rgb/head
        time_source: container
        resample: linear
        clock_policy: require_common_or_explicit_mapping
        max_gap_s: 0.1
      expected_rate_hz: 30
      window_length: 11
      vel_threshold_factor: 0.1
      jerk_threshold_m_s3: 15
  Numeric_Check:
    params:
      physical_fields:
      - /left_arm/end_pose.position
      - /left_arm/joint_states.position
      - /left_arm/joint_states.velocity
      - /master_left_arm/joint_states.position
      - /master_left_arm/joint_states.velocity
      - /master_right_arm/joint_states.position
      - /master_right_arm/joint_states.velocity
      - /right_arm/end_pose.position
      - /right_arm/joint_states.position
      - /right_arm/joint_states.velocity
  Video_Integrity:
    params:
      input_mode: auto
      sample_step: 1
      downscale: 4
  Sync_Check:
    params:
      primary: rgb/head
      timeline:
        time_source: container
  Root_Cause:
    params:
      timeline:
        time_source: container
