# Generic finite-value checks; this does not add a tactile/contact/slip detector.
defaults:
  selection: explicit
methods:
  Numeric_Check:
    params:
      channels:
      - joint/hand/left/feedback
      - joint/hand/left/command
      - joint/gripper/left/feedback
      - joint/gripper/left/command
      - tactile/hand/left@palm
      - tactile/hand/left@index_tip
      - joint/hand/right/feedback
      - joint/hand/right/command
      - joint/gripper/right/feedback
      - joint/gripper/right/command
      - tactile/hand/right@palm
      - tactile/hand/right@index_tip
