[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-dqs"
version = "0.1.0a3"
description = "Embodied Data Curation Framework: CPU inspection and auditable plugin workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
lerobot = ["lerobot[dataset]==0.6.1; python_version >= '3.12'", "h5py>=3.8; python_version >= '3.12'"]
formats = ["h5py>=3.8", "pyarrow>=14", "rosbags>=0.10", "mcap>=1.1", "protobuf>=4.25", "av>=12", "opencv-python-headless>=4.8", "scipy>=1.10", "xxhash>=3"]
test = ["pytest>=7", "build>=1"]

[project.scripts]
dqs = "dqs.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dqs*", "framework*", "Quality_Assessment", "Quality_Assessment.adapters*", "Quality_Assessment.data*", "Quality_Assessment.shared*", "Quality_Assessment.config*", "Quality_Assessment.algorithms", "Quality_Assessment.algorithms.Structure_Check*", "Quality_Assessment.algorithms.Numeric_Check*", "Quality_Assessment.algorithms.Action_Smoothness*", "Quality_Assessment.algorithms.Check_Timestamp*", "Quality_Assessment.algorithms.Sync_Check*", "Quality_Assessment.algorithms.Root_Cause*", "Quality_Assessment.algorithms.Dedup_Check*", "Quality_Assessment.algorithms.Reset_Detection*", "Quality_Assessment.algorithms.Video_Integrity*"]
exclude = ["*.tests*", "*.reset_detection*", "*.examples*"]
namespaces = true

[tool.setuptools.package-data]
"Quality_Assessment.config" = ["profiles/*.yaml"]

"Quality_Assessment.algorithms.Reset_Detection" = ["configs/*.yaml", "configs/robots/*/*.yaml"]
