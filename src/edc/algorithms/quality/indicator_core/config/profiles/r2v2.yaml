robot: r2v2
formats: [parquet, lerobot]
note: 统一 12 列 schema（V-R001）；parquet 无时间戳列；lerobot 10fps（V-R013）
topics:
  "/xhand_state": {modality: joint_state}
  "/joint_state": {modality: joint_state}
  "/left_ee_pose": {modality: pose}
  "/right_ee_pose": {modality: pose}
  "/target_q_pos": {modality: cmd}
  "/tauff": {modality: cmd}
  "/head_torso": {modality: cmd}
  "/xhand_control": {modality: cmd}
  "/left_ee_target": {modality: cmd}
  "/right_ee_target": {modality: cmd}
  "/compressed_image_image": {modality: image}
  "state": {modality: joint_state, expected_freq: 10.0}
  "actions": {modality: cmd, expected_freq: 10.0}
  "image": {modality: image, expected_freq: 10.0}
  "left_wrist_image": {modality: image, expected_freq: 10.0}
  "right_wrist_image": {modality: image, expected_freq: 10.0}
time_columns:
  lerobot: [timestamp]
  parquet: []
required_channels:
  parquet: ["/xhand_state", "/joint_state", "/left_ee_pose", "/right_ee_pose",
            "/target_q_pos", "/tauff", "/head_torso", "/xhand_control",
            "/left_ee_target", "/right_ee_target", "/compressed_image_image"]
  lerobot: ["state", "actions", "image", "left_wrist_image", "right_wrist_image"]
