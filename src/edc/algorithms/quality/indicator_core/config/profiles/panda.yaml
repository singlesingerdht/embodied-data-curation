robot: panda
formats: [lerobot]
note: 选手包（LeRobot v2.1，panda）
topics:
  "state": {modality: joint_state, expected_freq: 10.0}
  "actions": {modality: cmd, expected_freq: 10.0}
  "image": {modality: image, expected_freq: 10.0}
  "left_wrist_image": {modality: image, expected_freq: 10.0}
  "right_wrist_image": {modality: image, expected_freq: 10.0}
time_columns:
  lerobot: [timestamp]
required_channels:
  lerobot: ["state", "actions", "image", "left_wrist_image", "right_wrist_image"]
cameras:
  "/image": {role: "head"}
  "/left_wrist_image": {role: "left_wrist"}
  "/right_wrist_image": {role: "right_wrist"}
