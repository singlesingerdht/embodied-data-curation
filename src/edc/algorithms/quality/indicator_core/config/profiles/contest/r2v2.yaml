robot: r2v2
formats: [lerobot, parquet]
note: 比赛场景覆盖（在 r2v2 基础 profile 之上收紧阈值）
filters:
  content:
    freeze:
      config:
        image_freeze_low_frames: 3  # 比赛数据冻结更灵敏（默认 30）
    cmd_freeze:
      config:
        cmd_freeze_low_frames: 10  # 比赛数据 cmd 冻结更灵敏（默认 30）
  pipeline:
    episode_consistency:
      config:
        episode_min_topics: 2  # 2 个 topic 同时异常即视为切段点（默认 3）
  dedup:
    duplicate:
      config:
        dedup_ratio_high: 0.02  # 重复率 >= 此值即 error（默认 0.05 收紧）
