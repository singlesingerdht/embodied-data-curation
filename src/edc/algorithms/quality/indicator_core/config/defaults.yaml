# 全局阈值基线（非机型 profile：不参与机型识别/枚举；标识=文件名，robot 字段已移除）
note: >-
  全局判定阈值基线（所有机型自动叠加：defaults → 机型 → 场景，后者覆盖前者）。
  filters.<组>.<检测项>.config 存放该检测项判定参数；检测项归属（code/分组）
  由 indicators 注册表反查并在加载期校验（yaml 不再写 code，写错直接报错）。
  指标级开关在顶层 indicators 段（如 C1: false）；执行策略在顶层 sampling/executor 段。
indicators: {}          # 指标开关（默认全开）：{C1: false} 按 code 关；{content: false} 按组关
sampling:               # 执行策略（非判定阈值）：采样帧数/层级开关
  numeric_enabled: true     # 数值内容检测执行开关（I5/I6/I7/J5/J7/A5/A7 整组）
  image_layer1_enabled: true  # 图像层1（压缩域）执行开关
  image_layer2: true        # 图像第二层（采样帧内存解码）执行开关
  image_fullframe: true      # 全帧管线（1/4 灰度 turbojpeg 解码，需 unpack）
  sampling_head_count: 3
  sampling_mid_count: 3
  sampling_tail_count: 3
  sampling_full_scan_threshold: 100
  sampling_binary_search_depth: 10    # 单一数值源：content 与 structure 共用
  sampling_frame_dt_fallback_sec: 0.033
  sampling_frame_dt_max_sec: 10.0
  image_pixel_sample_count: 9
  image_layer2_focus_max: 15
executor:               # 执行器参数（并行调度，非指标阈值）
  episode_min_units: 200    # 内容并行拆集阈值（lerobot 默认；fourier 机型覆盖为 2）
filters:
  timing:
    drop:
      config:
        drop_gap_multiplier: 2.0  # dt > 此值x期望周期 判缺口(判定参数)
        drop_ratio_low: 0.02  # 丢帧率 > 此值 -> warning
        drop_ratio_high: 0.1  # 丢帧率 >= 此值 -> error
        drop_gap_low_sec: 0.5  # 单次缺口 >= 此秒 -> warning
        drop_gap_high_sec: 5.0  # 单次缺口 >= 此秒 -> error
        drop_gap_min_ms: 20.0  # 缺口判定绝对下限(ms), 高频下防时间戳量化误报
    jitter:
      config:
        jitter_cv_low: 0.3  # CV > 此值 -> warning(稳定档上限)
        jitter_cv_high: 0.5  # CV > 此值 -> error(burst)
        jitter_p95_multiplier: 1.5  # C2: CV<=0.3 但 P95(dt)>此倍数x期望周期 -> 附加预警
    out_of_order:
      config:
        out_of_order_low: 0.01  # 乱序占比 > 此值 -> warning
        out_of_order_high: 0.05  # 乱序占比 >= 此值 -> error
        small_backward_threshold_ms: 50.0  # 乱序倒退 >= 此值(ms) -> error
    delay:
      config:
        delay_spike_sigma: 3.0  # 尖峰 sigma 倍数(判定参数)
        delay_spike_absolute_ms: 100.0  # 尖峰绝对阈值(判定参数)
        delay_low_ms: 100.0  # P99 > 此值 -> warning
        delay_high_ms: 500.0  # P99 >= 此值 -> error
        delay_depth_low_ms: 300.0  # 深度图像通道 P99 > 此值 -> warning(设计表 C8 专用线)
    silence:
      config:
        silence_window_sec: 1.0  # 静默判定窗口(判定参数)
        silence_min_windows: 3  # 最少静默窗口数(判定参数)
        silence_low_sec: 2.0  # 静默时长 >= 此秒 -> warning
        silence_high_sec: 5.0  # 静默时长 >= 此秒 -> error
    frequency_deviation:
      config:
        topic_expected_freq_default: 0.0  # 全局默认期望频率(Hz)：>0 时未显式配置的 topic 用它做偏离基准；0=不启用
        frequency_tolerance: 0.2  # 频率偏离 +-此比例 -> warning(判定参数)
        frequency_period_fallback_freq: 30.0  # 无实测 dt 时兜底频率(判定参数)
        frequency_period_low_sec: 0.0001  # 中位 dt 合法下界(判定参数)
        frequency_period_high_sec: 1.0  # 中位 dt 合法上界(判定参数)
    timestamp_duplicate:
      config:
        duplicate_consecutive_threshold: 5  # 时间戳连续重复 >= 此帧数 -> 记录
    timestamp_validity:
      config: {}
  sync:
    coverage:
      config:
        coverage_low: 0.8  # 覆盖率 < 此值 -> error(下限)
        coverage_high: 0.95  # 覆盖率 < 此值 -> warning(下限)
        late_start_threshold_sec: 5.0  # 晚启动 > 此秒 -> warning
        early_end_threshold_sec: 5.0  # 早停止 > 此秒 -> warning
    alignment:
      config:
        alignment_sync_threshold_ms:  # 对齐检测灵敏度(低于不检,按模态对取值,判定参数)
          camera_to_camera: 15
          camera_to_depth: 50
          camera_to_imu: 50
          camera_to_lidar: 100
          camera_to_joint: 50
          camera_to_cmd: 50
          default: 100
        alignment_low_ms: 100.0  # 对齐 P95 >= 此值 -> warning
        alignment_high_ms: 200.0  # 对齐 P95 >= 此值 -> error
    stability:
      config:
        stability_jump_threshold_ms: 30.0  # 相邻 Delta 突变 > 此值(ms) -> error
        drift_low: 5.0  # 漂移率 >= 此值(ms/min) -> warning
        drift_high: 20.0  # 漂移率 >= 此值(ms/min) -> error
        stability_stable_threshold_ms: 5.0  # Delta 标准差 < 此值 -> 稳定(fixed_offset)
        stability_min_samples: 100  # 稳定性最少样本数(判定参数)
        stability_cluster_window_ms: 200.0  # 时钟分段聚类窗口(判定参数)
  content:
    black_screen:
      config:
        pixel_black_mean: 5.0  # mean < 此值 且暗占比达标 -> 黑屏
        pixel_black_std: 8.0  # 黑屏判定 std 辅助(判定参数)
        pixel_black_saturate_level: 5.0  # 灰度 < 此值 记为暗像素(判定参数)
        pixel_black_saturate_ratio: 0.5  # 暗像素占比 > 此值 -> 黑屏
        pixel_white_mean: 250.0  # mean > 此值 -> 白屏
        pixel_white_saturate_level: 245.0  # 亮像素定义:灰度 > 此值(判定参数)
        pixel_white_saturate_ratio: 0.5  # 且亮像素占比 > 此值 -> 白屏
        image_abs_size_floor_bytes: 8000  # 压缩尺寸 < 此字节 疑黑/白屏(判定参数)
        image_collapse_ratio: 0.2  # 尺寸 < 中位数x此比例 -> 骤减
        image_collapse_min_run: 2  # 尺寸骤减连续 >= 此帧数(判定参数)
    bad_frame_summary:      # C5 全族坏帧汇总分级（黑/白/花/遮挡/曝光共用，族级参数）
      config:
        bad_frame_low: 0.05  # 坏帧占比 > 此值 -> warning
        bad_frame_high: 0.3  # 坏帧占比 >= 此值 -> error
    occlusion:
      config:
        pixel_occlusion_mean: 70.0  # 遮挡:mean < 此值（对抗验证收紧：正常场景暗格误报）
        pixel_occlusion_black_cell: 10.0  # 遮挡"黑块"阈值(判定参数)
        pixel_occlusion_dark_cell: 40.0  # 遮挡"暗块"阈值(判定参数)
        pixel_occlusion_frac_low: 0.05  # 暗/黑块占比下界(判定参数)
        pixel_occlusion_frac_high: 0.75  # 暗/黑块占比上界(判定参数)
    garbled:
      config:
        pixel_garbled_strong_frac: 0.3  # 花屏:强梯度占比 > 此值
        pixel_garbled_grad_mean: 20.0  # 花屏:梯度均值 > 此值(判定参数)
        pixel_garbled_grad_threshold: 40.0  # 强梯度定义 |diff| > 此值(判定参数)
    overexpo:
      config:
        pixel_overexpo_mean: 130.0  # 过曝:mean > 此值
        pixel_overexpo_std: 60.0  # 过曝 std 辅助(判定参数)
    underexpo:
      config:
        pixel_underexpo_mean: 70.0  # 欠曝:mean < 此值
        pixel_underexpo_std: 15.0  # 欠曝 std 辅助(判定参数)
    color_anomaly:
      config:
        pixel_color_anomaly_range: 100.0  # 通道均值差 > 此值 -> 偏色
    blur:
      config:
        image_blur_low_ratio: 0.2  # 模糊带上界(判定参数)
        image_blur_high_ratio: 0.55  # 模糊带下界(判定参数)
        image_blur_min_run: 5  # 模糊带连续 >= 此帧数(判定参数)
        image_blur_ratio: 0.4  # 帧清晰度 < 中位数x此比例 -> 模糊
        image_sharpness_floor: 150.0  # VoL 中位数 < 此值 -> 相机持续模糊
        blur_low: 0.1  # 模糊帧占比 > 此值 -> warning
        blur_high: 0.3  # 模糊帧占比 >= 此值 -> error
    freeze:
      config:
        image_freeze_low_frames: 30  # 图像冻结 >= 此帧数 -> warning(~1s)
        image_freeze_high_frames: 150  # 图像冻结 >= 此帧数 -> error(~5s)
        freeze_cross_validate: true  # 冻结交叉验证开关（参考通道同静止→自然静止降级 pass）
        freeze_motion_threshold: 0.05  # 参考通道等效速度 < 此值 -> 自然静止(判定参数)
        image_freeze_min_run: 3  # 全帧冻结 xxhash 连续相同帧数 → warning
        image_freeze_cut_run: 30  # 全帧冻结 xxhash 连续相同帧数 → error
    joint_freeze:
      config:
        joint_freeze_low_frames: 50  # 关节冻结 >= 此帧数 -> warning(~1s)
        joint_freeze_high_frames: 250  # 关节冻结 >= 此帧数 -> error(~5s)
    imu_freeze:
      config:
        imu_freeze_low_frames: 200  # IMU 冻结 >= 此帧数 -> warning(~1s)
        imu_freeze_high_frames: 1000  # IMU 冻结 >= 此帧数 -> error(~5s)
    cmd_freeze:
      config:
        cmd_freeze_low_frames: 30  # cmd 冻结 >= 此帧数 -> warning(~1s)
        cmd_freeze_high_frames: 150  # cmd 冻结 >= 此帧数 -> error(~5s)
    pose:
      config:
        pose_freeze_min_sec: 1.0  # 冻结最低时长 秒（≤1s 不报，对齐 I/J/A/C 族 1s/5s 惯例）
        pose_freeze_cut_sec: 5.0  # 冻结 error 时长 秒（≥5s → error）
        pose_freeze_lookback: 10  # 位姿冻结 lookback 窗口帧数
        pose_freeze_vel_threshold: 0.01  # 位姿冻结前运动速度阈值(m/s)
        pose_freeze_gap_factor: 2.5  # 发布间隙自适应系数(常规间隙×此值以下不报冻结；fill-forward 源防误报)
        pose_reset_tolerance1: 0.01  # 首末帧复位容忍度1（≤ 不报）
        pose_reset_tolerance2: 0.05  # 首末帧复位容忍度2（≥ error）
        pose_reset_rot_tolerance1: 0.2  # 复位姿态容忍度1 rad（≤ 不报，默认 ≈11.5°）
        pose_reset_rot_tolerance2: 0.5  # 复位姿态容忍度2 rad（≥ error，默认 ≈28.6°）
        pose_jerk_window: 11  # SG 滤波窗口
        pose_jerk_polyorder: 3  # SG 多项式阶数
        pose_jerk_vel_factor: 0.1  # 静止判定速度因子（< 10%×峰值 → 准静止）
        pose_jerk_static_vel: 0.02  # 绝对静止线(m/s, 配合相对线取 min；快通道慢滑行不误判静止)
        pose_jerk_min_segment: 20  # 最小静止段帧数
        pose_jerk_threshold: 5.0  # 抖动 jerk 阈值 m/s³（warning 线，Action_Smoothness P80 满分线）
        pose_jerk_error: 15.0  # 抖动 jerk 熔断线 m/s³（≥此值 → error，Action_Smoothness T_min）
    joint_anomaly:
      config:
        joint_jump_threshold: 1.0  # |dpos|/dt > 此值(rad/s) -> joint_jump
        joint_velocity_peak: 20.0  # 关节速度峰值(判定参数)
        joint_reset_ratio: 0.6  # 同步跳变关节占比 >= 此值 -> 复位(error)
    cmd_anomaly:
      config:
        jerk_threshold: 10.0  # jerk > 此值 -> cmd_jerk
    imu_anomaly:
      config:
        acc_max_threshold: 196.2  # 加速度模长 > 此值(m/s2) -> error(爆表)
        gyro_max_threshold: 10.0  # 角速度模长 > 此值(rad/s) -> error(爆表)
    bias:
      config:
        imu_bias_detect: true  # IMU 偏置检测执行开关（I6；指标级关断用 indicators: {I6: false}）
        imu_bias_gyro_max: 0.05  # 静止段 gyro 均值 > 此值(rad/s) -> 偏置
        imu_bias_acc_max: 0.5  # 静止段 |acc|-9.81 > 此值(m/s²) -> 偏置
        imu_bias_min_static: 50  # 静止段最少连续帧(判定参数)
        imu_bias_static_diff: 0.02  # 静止判定:相邻帧 gyro 变化 < 此值(判定参数)
        imu_bias_static_spread: 0.2  # 静止段 gyro 跨度 < 此值(判定参数)
  structure:
    file_integrity:
      config:
        integrity_metadata_count_tolerance: 0.05  # 消息数偏差容忍比例(判定参数)
    lerobot_integrity:
      config:
        integrity_corrupt_low: 0.01  # 损坏集占比 >= 此值 -> warning
        integrity_corrupt_high: 0.10  # 损坏集占比 >= 此值 -> error
    scale_change:
      config:
        scale_window_low: 40.0  # M7 尺度突变检测窗口下界（幅度比落入 [low,high] 判 rad<->deg 突变，57.3 邻域；是窗口非分级阈值）
        scale_window_high: 75.0  # M7 尺度突变检测窗口上界
  pipeline:
    episode_consistency:
      config:
        episode_min_topics: 3  # M10 最少异常 topic 数(判定参数)
        episode_window_ms: 200  # M10 聚合窗口(判定参数)
        episode_merge_sec: 0.5  # M10 相邻切段合并(判定参数)
  dedup:
    duplicate:
      config:
        dedup_ratio_low: 0.01  # 重复率 > 此值 -> warning(实际 info 档,报告层归一 pass)
        dedup_ratio_high: 0.05  # 重复率 >= 此值 -> error
